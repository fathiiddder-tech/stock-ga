<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Stock RH</title>

<style>
body{
    font-family: Arial, sans-serif;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#003366;
    color:white;
    padding:15px;
    text-align:center;
}

.container{
    width:90%;
    margin:auto;
    padding:20px;
}

.cards{
    display:flex;
    gap:20px;
    margin-bottom:20px;
}

.card{
    flex:1;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.1);
    text-align:center;
}

form{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:10px;
    margin:8px 0;
}

button{
    background:#0078D4;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    padding:12px;
    border:1px solid #ddd;
    text-align:center;
}

th{
    background:#003366;
    color:white;
}
</style>
</head>

<body>

<header>
<h1>Gestion du Stock RH</h1>
</header>

<div class="container">

<div class="cards">
<div class="card">
<h3>Articles</h3>
<h2 id="totalArticles">0</h2>
</div>

<div class="card">
<h3>Stock Total</h3>
<h2 id="totalStock">0</h2>
</div>
</div>

<form id="stockForm">
<h2>Ajouter un article</h2>

<input type="text" id="article" placeholder="Article (Badge, Blouse, Casier...)" required>

<input type="number" id="quantity" placeholder="Quantité" required>

<button type="submit">Ajouter</button>
</form>

<h2>Liste du stock</h2>

<table>
<thead>
<tr>
<th>Article</th>
<th>Quantité</th>
<th>Action</th>
</tr>
</thead>

<tbody id="stockTable">
</tbody>
</table>

</div>

<script>

let stock=[];

document.getElementById("stockForm").addEventListener("submit",function(e){

e.preventDefault();

let article=document.getElementById("article").value;
let quantity=parseInt(document.getElementById("quantity").value);

stock.push({
article:article,
quantity:quantity
});

document.getElementById("article").value="";
document.getElementById("quantity").value="";

displayStock();

});

function displayStock(){

let table=document.getElementById("stockTable");
table.innerHTML="";

let totalStock=0;

stock.forEach((item,index)=>{

totalStock += item.quantity;

table.innerHTML += `
<tr>
<td>${item.article}</td>
<td>${item.quantity}</td>
<td>
<button onclick="removeItem(${index})">
Supprimer
</button>
</td>
</tr>`;
});

document.getElementById("totalArticles").innerText=stock.length;
document.getElementById("totalStock").innerText=totalStock;
}

function removeItem(index){
stock.splice(index,1);
displayStock();
}

</script>

</body>
</html>
